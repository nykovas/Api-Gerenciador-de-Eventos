spring:
  application:
    name: api-ger-eventos
  datasource:
    url: jdbc:postgresql://localhost:5432/api_gerenciador_eventos
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true